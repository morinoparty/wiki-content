# PR では build + dry-run だけ、main への push で wiki-content Worker に deploy する。
# index 群 (article.json, slug-index.json, categories.json, article/<uuid>/info.json) は
# cf build が wrangler.config.ts の build.command (hagaki generate) で生成する。
# 生成物は git にコミットしない — Workers Assets にだけ載る。
name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # @morinoparty/hagaki を GitHub Packages から取得する
  packages: read

concurrency:
  # 本番 deploy (main への push) は固定のグループで直列化する。
  # PR / 手動実行は dry-run までなので ref ごとに分け、本番の待ち行列を押し出さない。
  group: ${{ github.event_name == 'push' && 'deploy-production' || format('deploy-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          # info.json の履歴マージ (git log) に全履歴が必要
          fetch-depth: 0

      # pnpm (package.json の packageManager) と Node (.node-version) をまとめて入れる。
      # pnpm/action-setup の self-installer (npm 経由) を使わないので速い
      - uses: pnpm/setup@v3
        with:
          cache: true      # pnpm store を lockfile ごとにキャッシュ
          install: false   # GitHub Packages の認証を install の前に挟むため

      # GitHub Packages の npm レジストリは公開パッケージでも認証が要る
      - name: Authenticate to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm exec cf build --mode production

      - run: pnpm exec cf deploy --prebuilt --mode production --dry-run

      # main への push のときだけ本番 deploy する (PR と手動実行は dry-run まで)
      - if: github.event_name == 'push'
        run: pnpm exec cf deploy --prebuilt --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
